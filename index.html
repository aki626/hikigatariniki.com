<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>弾き語りオープンチャット</title>

<link rel="stylesheet" href="style.css">

<style>
/* ロード画面 */
#loader {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  font-size: 20px;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 6px solid #ddd;
  border-top-color: #4caf50;
  border-radius: 50%;
  animation: spin 1秒 linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.fade {
  opacity: 0;
  visibility: hidden;
  transition: 0.5s;
}


/* 参加ボタン */
.join-btn {
  position: fixed;
  right:20px;
  top:20px;
  background:#06c755;
  color:white;
  padding:12px 20px;
  border-radius:30px;
  text-decoration:none;
}


/* 基本 */
body {
  font-family:sans-serif;
  padding:30px;
  background:#fafafa;
}

h1 {
  text-align:center;
}

.desc {
  line-height:1.8;
}


/* メンバー */
.member-list {
  display:flex;
  flex-wrap:wrap;
  gap:15px;
}


.member-card {
  background:white;
  padding:20px;
  border-radius:15px;
  width:220px;
  box-shadow:0 3px 10px #ccc;
  cursor:pointer;
}

.member-card:hover {
  transform:scale(1.03);
}


.member-name {
  font-weight:bold;
}

.member-role {
  color:#777;
}


/* プロフィール */
.profile-view {
  background:white;
  padding:20px;
  border-radius:15px;
}

.back-btn {
  padding:10px 20px;
}
</style>

</head>


<body>


<!-- ロード画面 -->
<div id="loader">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>



<a href="https://openchat-review.me/oc/473699" class="join-btn">
オープンチャットに参加する
</a>



<h1>
弾き語りオープンチャット
</h1>


<p class="desc">

このオープンチャットは弾き語りオプです<br>
できてまだ一か月たってないのにメンバーは25人います！😋<br>
ライブトークで弾き語りもしています。<br>
雑談もOKです！<br>

</p>



<h2>ルール</h2>

<div>
暴言 ✖　誹謗中傷 ✖
</div>



<h3>
メンバー一覧
</h3>


<div id="memberList" class="member-list">


<!-- ここに今のmember-cardを全部貼る -->


</div>




<div id="profileView" class="profile-view" style="display:none">

<h2 id="profileName"></h2>

<p id="profileText"></p>

<button class="back-btn" onclick="backToList()">
戻る
</button>

</div>





<script>


// ロード処理

window.addEventListener("load",()=>{

const loader=document.getElementById("loader");

loader.classList.add("fade");


setTimeout(()=>{
loader.style.display="none";
},500);


});




// プロフィール表示

function showProfile(name,text){

document.getElementById("memberList").style.display="none";

document.getElementById("profileView").style.display="block";

document.getElementById("profileName").innerText=name;

document.getElementById("profileText").innerText=text;

}




function backToList(){

document.getElementById("profileView").style.display="none";

document.getElementById("memberList").style.display="flex";

}


</script>


</body>
</html>
